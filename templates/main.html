{# https://jinja.palletsprojects.com/en/stable/templates/ Jinja documentation for syntax #}
<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>{% block title %}Cafe Manager{% endblock %}</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css')}}">
    </head>
    <body>
        <header>
            <h1>Cafe Manager</h1>
            <nav>
                {% for key, info in databases.items()%}
                <a href="{{ url_for('display_table', name=key) }}">{{ info.title }}</a>
                {% endfor %}
            </nav>
        </header>
        <main>
            {% block content %}{% endblock %}
        </main>
    </body>
</html>
